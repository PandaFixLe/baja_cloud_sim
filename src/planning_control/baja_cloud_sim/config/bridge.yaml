- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/ground_truth/odom"
  gz_topic_name: "/model/baja_vehicle/ground_truth_odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/wheel_odom"
  gz_topic_name: "/model/baja_vehicle/wheel_odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/model/baja_vehicle/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/model/baja_vehicle/cmd_vel"
  gz_topic_name: "/model/baja_vehicle/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/simulation/recording_camera/image"
  gz_topic_name: "/simulation/recording_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# LiDAR point cloud for the perception group's pipeline (patchwork++ / cluster /
# surface_detector). Published by the gpu_lidar sensor in the Gazebo world SDF.
# NOTE: LiDAR point cloud is NOT bridged here on purpose.
# The distro's ros_gz_bridge corrupts gz.msgs.PointCloudPacked ->
# sensor_msgs/msg/PointCloud2 (all points become -inf). Instead, the
# gz_pcl_bridge.py node subscribes to the raw Gazebo topic and republishes
# a correct ROS PointCloud2 on /lidar/points.
