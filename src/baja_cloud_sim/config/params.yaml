truth_perception_node:
  ros__parameters:
    use_sim_time: true
    perception_forward: 34.0
    perception_backward: 6.0
    localization_position_stddev_m: 0.015
    localization_altitude_stddev_m: 0.020
    localization_yaw_stddev_deg: 0.12
    # Phase-0 platform remap: simulation reads Gazebo ground-truth odometry.
    # On the real car this node is replaced by a real localization node.
    ground_truth_odom_topic: "/ground_truth/odom"

frenet_planner_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    horizon_m: 30.0
    center_weight: 1.0
    clearance_weight: 12.0
    desired_clearance: 1.2
    vehicle_length: 3.0
    vehicle_width: 1.5
    # 忽略传感器原点附近(车体自身/地面杂波)的虚假障碍检测，避免起点附近出现幽灵膨胀框
    min_obstacle_range: 0.5

path_follower_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    target_speed: 2.5
    lookahead_distance: 3.0
    kp_heading: 1.0
    max_steering_angle: 35.0
    use_speed_profile: true
    desired_clearance: 3.5
    min_speed_obstacle: 2.0
    lqr_R: 3.0
    lqr_v_norm: 1.5
    lqr_Q: [0.05, 8.0, 2.0, 4.0, 0.5] # [∫e_y, e_y, e_y_dot, e_psi, e_psi_dot] (retuned for line-holding)
    s_proj_lookahead: 0.8
    max_lateral_accel: 1.8                # curvature ceiling (was 2.5 default)
    terrain_slope_threshold: 0.06
    terrain_min_speed: 1.0
    use_terrain_profile: false       # 实车对接感知后统一由 flat_ground 障碍物处理地形降速
    enable_lqr: true
    # ── 障碍物分类控制（感知组通过 /obstacle_markers 的 ns 区分类型）──
    # tall:         高障碍物，必须横向避让 + 按 clearance 减速
    # flat_ground:  特殊地面(土坡/减速带)，直线通过 + 平滑降速，不横向避让
    obstacle_classes:
      tall:
        lateral_avoid: true
        desired_clearance: 1.5
        min_speed: 1.5
      flat_ground:
        lateral_avoid: false
        approach_distance: 5.0      # 提前/过后对称平滑过渡距离 (m)
        slow_speed: 2.0             # 通过特殊地面时的目标速度 (m/s)
        default_half_width: 0.9     # tall 默认包围盒半宽兜底 (车宽1.5*0.6)
    # 忽略传感器原点附近(车体自身/地面杂波)的虚假障碍检测，避免起点附近幽灵膨胀框
    min_obstacle_range: 0.5

    # ── Longitudinal cascaded-PID (Apollo-style) ──
    lon_kp: 2.0
    lon_ki: 0.5
    lon_kd: 0.2
    lon_i_limit: 2.0
    idle_speed: 1.0
    slope_comp_gain: 1.0
    speed_profile_max: 3.5
    lon_accel_step: 0.20   # m/s per 50 ms ≈ 4.0 m/s²
    lon_decel_step: 0.25   # ≈ 5.0 m/s²
    # ── Finish / 终点逻辑（line | circle | time | none） ──
    finish_mode: "none"            # none | line | circle | time
    finish_runout_m: 20.0          # 冲过终点后再 20m 停车区
    finish_decel: 1.5              # 减速停车减速度（≤ lon_decel_step 等效 5，更丝滑）
    finish_s: -1.0                 # -1=自动(闭环→0 / 开放赛道→总长-runout)
    finish_target_lap: 1           # circle 仅用：跑满几圈后停
    finish_time_limit_s: 1200.0    # time 仅用：20 min
    finish_max_duration_s: 600.0   # 全局安全看门狗（防触发失效无限跑）

actuator_adapter_node:
  ros__parameters:
    use_sim_time: true
    wheelbase: 1.43
    command_timeout: 0.35
    # Phase-0 platform remaps (real-car port):
    # simulation → Gazebo vehicle; real car → chassis driver topic.
    cmd_vel_topic: "/model/baja_vehicle/cmd_vel"
    odom_topic: "/ground_truth/odom"

evaluator_node:
  ros__parameters:
    use_sim_time: true
