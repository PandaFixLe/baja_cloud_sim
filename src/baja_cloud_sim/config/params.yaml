truth_perception_node:
  ros__parameters:
    use_sim_time: true
    perception_forward: 34.0
    perception_backward: 6.0
    localization_position_stddev_m: 0.015
    localization_altitude_stddev_m: 0.020
    localization_yaw_stddev_deg: 0.12

frenet_planner_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    horizon_m: 30.0
    center_weight: 1.0
    clearance_weight: 12.0
    desired_clearance: 1.2
    vehicle_length: 2.1
    vehicle_width: 1.55
    safety_margin: 0.15
    enable_path_log: true
    path_log_dir: results

path_follower_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    target_speed: 6.0
    lookahead_distance: 3.0
    kp_heading: 1.2
    max_steering_angle: 35.0
    controller_mode: stanley
    kd_heading: 0.3
    k_stanley: 0.8
    k_cte_dot: 0.15
    k_yaw_rate: 0.5
    steering_alpha: 0.6
    max_steer_rate_deg: 50.0
    adaptive_steering: true
    adaptive_speed: true

actuator_adapter_node:
  ros__parameters:
    use_sim_time: true
    wheelbase: 1.43
    command_timeout: 0.35

evaluator_node:
  ros__parameters:
    use_sim_time: true
