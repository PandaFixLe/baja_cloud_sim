truth_perception_node:
  ros__parameters:
    use_sim_time: true
    perception_forward: 34.0
    perception_backward: 6.0
    localization_position_stddev_m: 0.015
    localization_altitude_stddev_m: 0.020
    localization_yaw_stddev_deg: 0.12
    # v1.1-yaml-spec-test: runtime-tunable switch.
    # ros2 param set /truth_perception_node enable_obstacles false
    # makes the /obstacle_markers topic publish an empty MarkerArray,
    # simulating obstacle-free world without restarting the simulation.
    enable_obstacles: true

frenet_planner_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    horizon_m: 30.0
    center_weight: 1.0
    clearance_weight: 12.0
    desired_clearance: 1.2
    vehicle_length: 3.0
    vehicle_width: 1.5
    enable_path_log: true
    path_log_dir: results

path_follower_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    target_speed: 2.5
    lookahead_distance: 3.0
    kp_heading: 1.2
    max_steering_angle: 35.0
    controller_mode: stanley
    kd_heading: 0.3
    k_stanley: 0.8
    k_cte_dot: 0.15
    k_yaw_rate: 0.5
    steering_alpha: 0.6
    max_steer_rate_deg: 8.0
    adaptive_steering: true
    adaptive_speed: true

actuator_adapter_node:
  ros__parameters:
    use_sim_time: true
    wheelbase: 1.43
    command_timeout: 0.35

evaluator_node:
  ros__parameters:
    use_sim_time: true

# ============================================================
# 算法默认参数（工程规范第一步）
# core.py 在启动时按需加载；找不到文件 / 字段缺失时
# 静默回退到 core.py 内 dataclass 默认值。
# 字段名/类型/单位与 core.py 三个 dataclass 严格一致；
# 修改此文件不需要改代码，但**改了之后必须重新启动节点**才生效。
# ============================================================
algorithm_defaults:
  planner:
    # Frenet 规划器（PlannerConfig）
    horizon_m: 30.0
    layer_spacing_m: 1.0
    lateral_spacing_m: 0.25
    vehicle_length: 3.0
    vehicle_width: 1.5
    safety_margin: 0.25
    desired_clearance: 1.2
    center_weight: 1.0
    clearance_weight: 12.0
    smooth_weight: 7.0
    slope_weight: 3.0
    max_lateral_step: 0.9
  controller:
    # 通用下层控制器（ControllerConfig，用于 legacy_path_control）
    target_speed: 2.5
    lookahead_distance: 3.0
    heading_gain: 1.2
    max_steering_deg: 35.0
  stanley_controller:
    # Stanley 控制律（StanleyControllerConfig，v1.1 新增）
    # 继承 controller 全部字段
    target_speed: 2.5
    lookahead_distance: 3.0
    heading_gain: 1.2
    max_steering_deg: 35.0
    # Stanley 专属字段
    kd_heading: 0.3
    k_stanley: 0.8
    k_cte_dot: 0.15
    k_yaw_rate: 0.5
    steering_alpha: 0.6
    max_steer_rate_deg: 8.0
    yaw_rate_alpha: 0.7
    yaw_rate_scale: 0.3
    min_speed_for_stanley: 2.0
    adaptive_steering: true
    adaptive_speed: true
    preview_curv_boost_limit: 1.5
    preview_curv_boost_scale: 5.0
