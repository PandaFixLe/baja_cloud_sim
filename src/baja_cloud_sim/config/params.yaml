truth_perception_node:
  ros__parameters:
    use_sim_time: true
    perception_forward: 34.0
    perception_backward: 6.0

frenet_planner_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    horizon_m: 30.0
    center_weight: 1.0
    clearance_weight: 12.0
    desired_clearance: 1.2
    vehicle_length: 3.0
    vehicle_width: 1.5
    safety_margin: 0.25

path_follower_node:
  ros__parameters:
    use_sim_time: true
    origin_latitude: 30.0
    origin_longitude: 114.0
    target_speed: 2.5
    lookahead_distance: 3.0
    kp_heading: 1.2
    max_steering_angle: 35.0

actuator_adapter_node:
  ros__parameters:
    use_sim_time: true
    wheelbase: 1.43
    command_timeout: 0.35

evaluator_node:
  ros__parameters:
    use_sim_time: true
